<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Converter - Fast & Secure</title>
    <meta name="description" content="Fast, secure, and private PDF conversion directly in your browser.">
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="background-elements">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>PDF Converter</h1>
            <p>Private & secure client-side conversions</p>
        </header>

        <section class="tools-grid">
            <button class="tool-btn active" data-tool="image-to-pdf">
                <span class="icon">🖼️</span>
                Image to PDF
            </button>
            <button class="tool-btn" data-tool="merge-pdf">
                <span class="icon">📑</span>
                Merge PDFs
            </button>
        </section>

        <section class="upload-zone" id="drop-zone">
            <div class="upload-content">
                <div class="upload-icon">☁️</div>
                <h3>Drag & Drop files here</h3>
                <p>or</p>
                <label for="file-input" class="browse-btn">Browse Files</label>
                <input type="file" id="file-input" multiple accept="image/*">
            </div>
            <div id="file-list" class="file-list"></div>
        </section>

        <div class="action-section">
            <button id="convert-btn" class="primary-btn" disabled>Convert Files</button>
        </div>

        <div id="status" class="status-message"></div>
    </main>

    <!-- PDF-Lib -->
    <script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
